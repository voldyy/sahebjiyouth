<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yogi Prasad</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fff6e5">
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --line:#ead7b7; --field-line:#d7c19b; --field-bg:#fffdf8; --surface:#fff8ec; --accent:#a83224; --accent-dark:#81251b; --gold:#c28a18; --focus:#b7791f; --ok:#16794c;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--surface); -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink);
      background: radial-gradient(circle at 12% 0%, rgba(194,138,24,.16), transparent 34rem), linear-gradient(180deg,#fffaf0 0%,#fff6e5 48%,#fffdf8 100%); }
    button, input { font: inherit; }
    .page { display: flex; justify-content: center; padding: max(18px, env(safe-area-inset-top)) 14px max(26px, env(safe-area-inset-bottom)); }
    .card { width: min(100%, 520px); background: rgba(255,255,255,.95); border: 1px solid rgba(234,215,183,.95); border-radius: 8px; box-shadow: 0 18px 46px rgba(91,57,18,.12); }
    header { padding: 22px 20px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, rgba(255,241,207,.78), rgba(255,255,255,.96)), #fff; }
    .logo { display: block; width: 140px; max-width: 62%; height: auto; margin-bottom: 16px; }
    .eyebrow { margin: 0 0 6px; color: var(--accent); font-size: .76rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(1.7rem, 8vw, 2.3rem); line-height: 1.05; }
    form, .done { padding: 20px; display: grid; gap: 18px; }
    .field { display: grid; gap: 7px; border: 0; margin: 0; padding: 0; min-width: 0; }
    label, legend { padding: 0; font-size: .96rem; font-weight: 780; color: #26364f; }
    input[type=text] { width: 100%; min-height: 52px; border: 1px solid var(--field-line); border-radius: 8px; background: var(--field-bg); padding: 12px 13px; color: var(--ink); font-size: 1rem; }
    input:focus-visible, button:focus-visible { outline: 3px solid rgba(183,121,31,.3); border-color: var(--focus); }
    .row { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; }
    .cal { display: grid; gap: 14px; }
    .month h3 { margin: 0 0 6px; font-size: .95rem; color: #26364f; }
    .grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .dow { text-align: center; font-size: .72rem; font-weight: 800; color: var(--muted); padding: 2px 0; }
    .day { position: relative; min-height: 46px; padding: 0; border: 1px solid var(--field-line); border-radius: 8px; background: var(--field-bg); color: var(--ink); font-weight: 750; font-size: .98rem; cursor: pointer; touch-action: pan-y; -webkit-tap-highlight-color: transparent; }
    .day:disabled { opacity: .3; cursor: default; }
    .day.today { box-shadow: inset 0 0 0 2px var(--gold); }
    .day[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: none; }
    .day.join-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
    .day.join-l { border-top-left-radius: 0; border-bottom-left-radius: 0; }
    .day.join-r::after { content: ""; position: absolute; right: -5px; top: -1px; bottom: -1px; width: 5px; background: var(--accent); }
    .blank { min-height: 46px; }
    .chips { display: flex; justify-content: flex-end; }
    .chip { min-height: 32px; padding: 0 12px; border: 1px solid #d8a437; border-radius: 999px; background: #fff6df; color: #684000; font-weight: 800; font-size: .78rem; cursor: pointer; }
    .regs { display: grid; gap: 12px; }
    .reg { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--field-bg); }
    .reg .actions { display: flex; gap: 10px; align-items: center; }
    .reg .actions .button { width: auto; flex: 1; min-height: 46px; }
    .mealcards { display: grid; gap: 10px; }
    .mealcard { border: 1px solid var(--field-line); border-radius: 10px; background: var(--field-bg); overflow: hidden; }
    .mealcard.has-days { border-color: #d8a437; }
    .mealcard.open { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .mealhead { display: grid; grid-template-columns: minmax(0,auto) minmax(0,1fr) 18px; align-items: center; gap: 12px; width: 100%; min-height: 66px; padding: 10px 14px; border: 0; background: none; color: var(--ink); text-align: left; cursor: pointer; }
    .mealcard.has-days .mealhead { background: #fff6df; }
    .mname strong { display: block; font-size: 1.02rem; }
    .mname small { color: var(--muted); font-weight: 600; font-size: .76rem; }
    .msum { color: var(--muted); font-size: .86rem; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
    .mealcard.has-days .msum { color: #5a3a00; }
    .chev { width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); justify-self: center; transition: transform .15s; }
    .mealcard.open .chev { transform: rotate(-135deg); }
    .mealbody { display: grid; gap: 12px; padding: 4px 14px 14px; }
    .button { min-height: 52px; border-radius: 8px; padding: 0 18px; font-weight: 850; cursor: pointer; border: 0; width: 100%; }
    .button:disabled { opacity: .62; cursor: not-allowed; }
    .primary { background: linear-gradient(180deg,#c64a3a,var(--accent)); color: #fff; box-shadow: 0 14px 28px rgba(168,50,36,.24); }
    .primary:not(:disabled):active { transform: translateY(1px); }
    .secondary { border: 1px solid #d8a437; background: #fff6df; color: #684000; }
    .icon { min-width: 52px; width: 52px; padding: 0; border: 1px solid var(--field-line); background: #fff; color: var(--accent); font-size: 1.4rem; line-height: 1; }
    .link { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 44px; cursor: pointer; }
    .error { margin: 0; padding: 12px 14px; border-radius: 8px; background: #fdecea; color: #8a1f14; font-weight: 700; }
    .error:empty { display: none; }
    .trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .done h2 { margin: 0; font-size: 1.5rem; color: var(--ok); }
    .summary { margin: 0; display: grid; gap: 6px; font-size: 1.05rem; font-weight: 700; }
    .summary span { color: var(--muted); font-weight: 600; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="page"><div class="card">
    <header>
      <img class="logo" src="/diwali/logo.png" alt="Anoopam Mission" width="140" height="48">
      <h1>Yogi Prasad</h1>
    </header>

    <form id="form" novalidate>
      <div class="field"><label for="me">Your name</label><input id="me" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" maxlength="60"></div>
      <fieldset class="field" id="familyField" hidden><legend>Family</legend><div id="family" style="display:grid;gap:8px"></div></fieldset>
      <button class="button secondary" type="button" id="add">+ Family member</button>
      <fieldset class="field"><legend>Meals and days</legend><div class="mealcards" id="meals"></div></fieldset>
      <div class="trap" aria-hidden="true"><label for="ref-code">Leave this empty</label><input id="ref-code" name="ref-code" type="text" tabindex="-1" autocomplete="off"></div>
      <p class="error" id="error" role="alert"></p>
      <button class="button primary" type="submit" id="submit">Submit</button>
    </form>

    <section class="done" id="done" hidden aria-live="polite">
      <h2>Thank you</h2>
      <div class="regs" id="regs"></div>
      <button class="button secondary" type="button" id="another">+ Add another person or days</button>
    </section>
    <section class="done" id="closed" hidden><h2 style="color:var(--muted)">Registration has closed</h2></section>
  </div></main>

  <script>
  (() => {
    const API = "https://mandir-hospitality-api.usayouth.workers.dev/api", STORE = "yp-meals", OLD_STORE = "yp-diwali-meals";
    const LAST = "2026-11-14", MAX_FAMILY = 11;   // the calendars end here
    const MEALS = [["breakfast", "Breakfast", "8–10 AM"], ["lunch", "Lunch", "12–2 PM"], ["dinner", "Dinner", "6–8 PM"]];
    const $ = id => document.getElementById(id);
    const uuid = () => crypto.randomUUID ? crypto.randomUUID() : ([1e7] + -1e3 + -4e3 + -8e3 + -1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
    const todayET = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" }).format(new Date());
    let today = todayET();
    const shift = (iso, n) => new Date(Date.parse(`${iso}T12:00:00Z`) + n * 86400000).toISOString().slice(0, 10);
    const last = LAST;
    const dow = iso => new Date(`${iso}T12:00:00Z`).getUTCDay();
    let saved = [], editing = null, attempt = { fp: "", id: "" };
    const picked = Object.fromEntries(MEALS.map(([id]) => [id, new Set()]));   // the chosen days for each meal

    // ---- family rows ----
    const familyRows = () => [...$("family").querySelectorAll("input")];
    function addFamily(value = "") {
      if (familyRows().length >= MAX_FAMILY) return;
      const row = document.createElement("div"); row.className = "row";
      const input = Object.assign(document.createElement("input"), { type: "text", value, maxLength: 60, autocapitalize: "words", autocomplete: "off" });
      input.setAttribute("aria-label", "Family member name");
      const remove = Object.assign(document.createElement("button"), { type: "button", className: "button icon", textContent: "×" });
      remove.setAttribute("aria-label", "Remove family member");
      remove.addEventListener("click", () => { row.remove(); sync(); });
      row.append(input, remove); $("family").append(row); sync(); if (!value) input.focus();
    }
    function sync() { $("familyField").hidden = !familyRows().length; $("add").hidden = familyRows().length >= MAX_FAMILY; }
    $("add").addEventListener("click", () => addFamily());

    // ---- day helpers ----
    const month = iso => iso.slice(0, 7);
    const monthsToShow = () => { const out = []; for (let m = month(today); m <= month(last); m = month(shift(`${m}-15`, 31).slice(0, 8) + "01")) out.push(m); return out; };
    const selectable = iso => iso >= today && iso <= last;
    const fullLabel = iso => new Date(`${iso}T12:00:00Z`).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
    const runs = days => { const out = []; for (const d of [...days].sort()) { const run = out.at(-1); if (run && shift(run.to, 1) === d) run.to = d; else out.push({ from: d, to: d }); } return out; };
    const short = iso => new Date(`${iso}T12:00:00Z`).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
    const describe = days => runs(days).map(({ from, to }) => from === to ? short(from) : month(from) === month(to) ? `${short(from)}–${to.slice(8).replace(/^0/, "")}` : `${short(from)} – ${short(to)}`).join(", ");
    const countText = n => `${n} ${n === 1 ? "day" : "days"}`;

    // ---- one compact card per meal; tapping it opens that meal's calendar ----
    const cards = {};
    for (const [id, name, time] of MEALS) {
      const card = document.createElement("section"); card.className = "mealcard"; card.dataset.meal = id;
      const head = document.createElement("button"); head.type = "button"; head.className = "mealhead"; head.setAttribute("aria-expanded", "false"); head.setAttribute("aria-controls", `panel-${id}`);
      const title = document.createElement("span"); title.className = "mname"; const strong = document.createElement("strong"); strong.textContent = name; const small = document.createElement("small"); small.textContent = time; title.append(strong, small);
      const sum = document.createElement("span"); sum.className = "msum"; const chev = document.createElement("span"); chev.className = "chev"; chev.setAttribute("aria-hidden", "true");
      head.append(title, sum, chev);
      const body = document.createElement("div"); body.className = "mealbody"; body.id = `panel-${id}`; body.hidden = true;
      const chips = document.createElement("div"); chips.className = "chips";
      const clear = Object.assign(document.createElement("button"), { type: "button", className: "chip", textContent: "Clear" }); chips.append(clear);
      const cal = document.createElement("div"); cal.className = "cal";
      body.append(chips, cal); card.append(head, body); $("meals").append(card);
      cards[id] = { card, head, body, cal, sum, name };
      head.addEventListener("click", () => toggle(id));
      clear.addEventListener("click", () => { picked[id] = new Set([...picked[id]].filter(d => !selectable(d))); refresh(id); });   // days that already passed stay as they were
      attachCalendar(id, cal);
    }
    function toggle(id) {
      const opening = !cards[id].card.classList.contains("open");
      for (const [other, c] of Object.entries(cards)) { const on = opening && other === id; c.card.classList.toggle("open", on); c.body.hidden = !on; c.head.setAttribute("aria-expanded", String(on)); }
      if (opening) cards[id].card.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    function buildMonths(id) {
      const { cal, name } = cards[id]; cal.replaceChildren();
      for (const m of monthsToShow()) {
        const box = document.createElement("section"); box.className = "month";
        const title = document.createElement("h3"); title.textContent = new Date(`${m}-15T12:00:00Z`).toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" }); box.append(title);
        const grid = document.createElement("div"); grid.className = "grid"; grid.setAttribute("role", "group"); grid.setAttribute("aria-label", `${name} · ${title.textContent}`);
        "SMTWTFS".split("").forEach(d => { const h = document.createElement("div"); h.className = "dow"; h.setAttribute("aria-hidden", "true"); h.textContent = d; grid.append(h); });
        // The first month starts at the current week, so days that are long past don't push the form down.
        const first = m === month(today) ? Math.max(1, +today.slice(8) - dow(today)) : 1;
        for (let i = 0; i < dow(`${m}-${String(first).padStart(2, "0")}`); i++) { const b = document.createElement("div"); b.className = "blank"; grid.append(b); }
        const count = m === month(last) ? +last.slice(8) : new Date(Date.UTC(+m.slice(0, 4), +m.slice(5), 0)).getUTCDate();
        for (let n = first; n <= count; n++) {
          const iso = `${m}-${String(n).padStart(2, "0")}`;
          const b = Object.assign(document.createElement("button"), { type: "button", className: "day", textContent: n });
          b.dataset.day = iso; b.setAttribute("aria-label", `${name}: ${fullLabel(iso)}`); b.disabled = !selectable(iso);
          if (iso === today) b.classList.add("today");
          grid.append(b);
        }
        box.append(grid); cal.append(box);
      }
      refresh(id);
    }
    function refresh(id) {
      const { cal, sum, card } = cards[id], set = picked[id];
      for (const b of cal.querySelectorAll("button[data-day]")) {
        const d = b.dataset.day, on = set.has(d), col = dow(d);
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.classList.toggle("join-r", on && col < 6 && set.has(shift(d, 1)) && month(d) === month(shift(d, 1)));
        b.classList.toggle("join-l", on && col > 0 && set.has(shift(d, -1)) && month(d) === month(shift(d, -1)));
      }
      card.classList.toggle("has-days", set.size > 0);
      sum.textContent = set.size ? `${describe(set)} · ${countText(set.size)}` : "Tap to choose days";
    }
    const buildAll = () => Object.keys(cards).forEach(buildMonths), refreshAll = () => Object.keys(cards).forEach(refresh);

    // A tap toggles one day. Sliding a finger (or the mouse) across days selects or clears the whole stretch from where it started.
    function attachCalendar(id, cal) {
      let drag = null, afterDrag = false;
      const dayAt = (x, y) => { const el = document.elementFromPoint(x, y)?.closest?.("button[data-day]"); return el && !el.disabled && cal.contains(el) ? el.dataset.day : null; };
      const paint = to => {
        const [lo, hi] = [drag.anchor, to].sort(), next = new Set(drag.base);
        for (let d = lo; d <= hi; d = shift(d, 1)) { if (!selectable(d)) continue; if (drag.on) next.add(d); else next.delete(d); }
        picked[id] = next; refresh(id);
      };
      cal.addEventListener("pointerdown", e => { afterDrag = false; const day = dayAt(e.clientX, e.clientY); if (day) drag = { anchor: day, base: new Set(picked[id]), on: !picked[id].has(day), moved: false }; });
      cal.addEventListener("pointermove", e => {
        if (!drag) return; const day = dayAt(e.clientX, e.clientY);
        if (!day || (day === drag.anchor && !drag.moved)) return;
        drag.moved = true; paint(day);
      });
      const endDrag = () => { if (drag?.moved) afterDrag = true; drag = null; };   // the click that follows a drag is not a tap
      addEventListener("pointerup", endDrag); addEventListener("pointercancel", endDrag);
      cal.addEventListener("click", e => {
        const b = e.target.closest("button[data-day]"); if (!b) return;
        if (afterDrag) { afterDrag = false; return; }
        const next = new Set(picked[id]); next.has(b.dataset.day) ? next.delete(b.dataset.day) : next.add(b.dataset.day); picked[id] = next; refresh(id);
      });
    }
    // ---- confirmation list ----
    // Meals with the same days are shown together, e.g. "Lunch · Dinner — Nov 6–8".
    const mealLines = mealDays => {
      const groups = new Map();
      for (const [id, name] of MEALS) {
        const days = mealDays[id]; if (!days?.length) continue;
        const key = days.join(","); if (!groups.has(key)) groups.set(key, { names: [], days }); groups.get(key).names.push(name);
      }
      return [...groups.values()].map(g => `${g.names.join(" · ")} — ${describe(g.days)}`);
    };
    const whoLine = names => names.length > 1 ? `${names[0]} + ${names.length - 1}` : names[0];
    function fill(reg) {
      $("me").value = reg.names[0] || ""; $("family").replaceChildren(); reg.names.slice(1).forEach(n => addFamily(n)); sync();
      for (const [id] of MEALS) picked[id] = new Set(reg.mealDays?.[id] || []);
      refreshAll();
    }
    function blank() {
      editing = null; $("me").value = ""; $("family").replaceChildren(); sync();
      for (const [id] of MEALS) picked[id] = new Set();
      refreshAll(); $("submit").textContent = "Submit"; fail("");
      for (const [id, c] of Object.entries(cards)) { c.card.classList.remove("open"); c.body.hidden = true; c.head.setAttribute("aria-expanded", "false"); }
    }
    function showList() {
      $("another").hidden = today > LAST;
      if (!saved.length) { $("done").hidden = true; $("form").hidden = today > LAST; $("closed").hidden = today <= LAST; return; }
      $("form").hidden = true; $("done").hidden = false; $("regs").replaceChildren();
      for (const entry of saved) {
        const reg = entry.reg, card = document.createElement("div"); card.className = "reg";
        const summary = document.createElement("div"); summary.className = "summary";
        const who = document.createElement("div"); who.textContent = whoLine(reg.names); summary.append(who);
        for (const line of mealLines(reg.mealDays || {})) { const when = document.createElement("span"); when.textContent = line; summary.append(when); }
        card.append(summary); $("regs").append(card);
        if (!entry.id) continue;   // a quietly ignored (bot) entry has nothing to edit
        const actions = document.createElement("div"); actions.className = "actions";
        const edit = Object.assign(document.createElement("button"), { type: "button", className: "button secondary", textContent: "Edit" });
        edit.addEventListener("click", () => { fail(""); fill(reg); editing = entry; $("submit").textContent = "Save"; $("done").hidden = true; $("form").hidden = false; window.scrollTo(0, 0); });
        const cancel = Object.assign(document.createElement("button"), { type: "button", className: "link", textContent: "Cancel" });
        cancel.addEventListener("click", async () => {
          if (!confirm("Cancel this registration?")) return;
          const result = await call({ action: "local-meals-cancel", id: entry.id, editKey: entry.editKey });
          if (!result.ok) return alert(result.error || "Please try again.");
          saved = saved.filter(e => e !== entry); persist(); showList();
        });
        actions.append(edit, cancel); card.append(actions);
      }
      window.scrollTo(0, 0);
    }
    const persist = () => { try { localStorage.setItem(STORE, JSON.stringify(saved.filter(e => e.id).map(({ id, editKey }) => ({ id, editKey })))); } catch {} };
    const fail = text => { $("error").textContent = text; if (text) $("error").scrollIntoView({ block: "nearest" }); };
    async function call(body) {
      const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 15000);
      try {
        const response = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: controller.signal });
        return await response.json();
      } catch { return { ok: false, error: "Not sent. Check your connection and try again." }; } finally { clearTimeout(timer); }
    }

    $("form").addEventListener("submit", async event => {
      event.preventDefault(); fail("");
      const names = [$("me").value, ...familyRows().map(i => i.value)].map(n => n.trim()).filter((n, i) => i === 0 || n);
      const mealDays = Object.fromEntries(MEALS.filter(([id]) => picked[id].size).map(([id]) => [id, [...picked[id]].sort()]));
      if (!names[0]) return fail("Add your name."); if (!Object.keys(mealDays).length) return fail("Choose days for a meal.");
      const body = { action: "local-meals-submit", names, mealDays, website: $("ref-code").value, ...(editing ? { id: editing.id, editKey: editing.editKey } : {}) };
      const fp = JSON.stringify(body); if (attempt.fp !== fp) attempt = { fp, id: uuid() };   // a retry of the same entry reuses its request id
      $("submit").disabled = true;
      const result = await call({ ...body, requestId: attempt.id });
      $("submit").disabled = false;
      if (!result.ok) return fail(result.error || "Please try again.");
      attempt = { fp: "", id: "" };
      if (result.ignored) { saved = [...saved, { id: "", editKey: "", reg: { names, mealDays } }]; blank(); return showList(); }
      const entry = { id: result.id, editKey: result.editKey, reg: result.registration };
      saved = editing ? saved.map(e => e === editing ? entry : e) : [...saved, entry]; persist(); blank(); showList();
    });
    $("another").addEventListener("click", () => { blank(); $("done").hidden = true; $("form").hidden = false; window.scrollTo(0, 0); });

    buildAll(); if (today > LAST) { $("form").hidden = true; $("closed").hidden = false; }
    // The first week follows the current day, including when the page stays open past midnight.
    const rollOver = () => {
      const now = todayET(); if (now === today) return;
      today = now; buildAll();
      if (today > LAST) { $("another").hidden = true; if ($("done").hidden) { $("form").hidden = true; $("closed").hidden = false; } }
    };
    document.addEventListener("visibilitychange", () => { if (!document.hidden) rollOver(); }); addEventListener("focus", rollOver);
    // Someone returning on the same phone sees their registrations and can edit or cancel them.
    (async () => {
      let stored = []; try { stored = JSON.parse(localStorage.getItem(STORE) || "null") || []; } catch { stored = []; }
      try { const old = JSON.parse(localStorage.getItem(OLD_STORE) || "null"); if (old?.id && old?.editKey && !stored.some(e => e.id === old.id)) stored.push(old); } catch {}
      const found = [];
      for (const entry of stored.filter(e => e?.id && e?.editKey)) {
        const result = await call({ action: "local-meals-lookup", id: entry.id, editKey: entry.editKey });
        if (result.ok) found.push({ ...entry, reg: result.registration });
        else if (result.error !== "This registration could not be found.") found.push(null);   // keep it if only the network failed
      }
      if (found.includes(null)) return;   // offline or rate limited: leave the form as is and keep the stored keys untouched
      saved = found; persist(); try { localStorage.removeItem(OLD_STORE); } catch {} showList();
    })();
  })();
  </script>
